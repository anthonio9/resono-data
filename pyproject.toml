[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resono-data"
version = "0.1.0"
description = "Data pipeline for guitar pitch recognition datasets"
authors = [{name = "Antoni Jankowski", email = "antoni.s.jankowski@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "soundfile",
    "librosa",
    "huggingface-hub",
    "jams",
    "mido",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["matplotlib"]
# Upstream penn, which ships FCNF0++ and fetches its weights from HuggingFace
# on first use. Only reguitarset's track-f0 step needs it, and that step runs
# once — the labels it produces are what ships — so it stays out of the base
# install rather than constraining torch for everyone.
#
# The torch ceiling is penn's dependency torbi, which ships prebuilt binaries
# per torch version and selects one by name at import ('pt211cpu'). It has
# nothing for torch 2.12+, and the failure is an unhelpful FileNotFoundError
# at import rather than a resolver conflict, so the bound is pinned here.
# See 'Relabelling dependencies' in README.adoc for the CPU-index install.
relabel = [
    "penn>=1.0.0",
    "torch>=2.6,<2.12",
    "torchaudio>=2.6,<2.12",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a downloaded dataset (skip with '-m not integration')",
]
