[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resono-data"
version = "0.1.0"
description = "Data pipeline for guitar pitch recognition datasets"
authors = [{name = "Antoni Jankowski", email = "antoni.s.jankowski@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "soundfile",
    "librosa",
    "huggingface-hub",
    "jams",
    "mido",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["matplotlib"]
# Upstream penn, which ships FCNF0++ and fetches its weights from HuggingFace
# on first use. Only reguitarset's track-f0 step needs it, and that step runs
# once, so it stays out of the base install.
relabel = ["penn>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a downloaded dataset (skip with '-m not integration')",
]
